    <path d="M152 70 L148 48 L166 56 L174 36 L190 48 L206 34 L216 52 L238 50 L232 72 C214 58 178 58 152 70 Z"/>
  </g>
  <path d="M60 300 C64 262 86 232 118 214 L150 202 L110 300 Z" fill="#070d1a"/>
  <path d="M320 300 C316 262 294 232 262 214 L230 202 L270 300 Z" fill="#070d1a"/>
  <!-- chest emblem -->
  <g transform="translate(190,246) scale(0.5) translate(-150,-146)" fill="url(#blue)" filter="url(#glow)">
    <path d="M138 128 L50 85 L82 125 L58 132 L92 152 L72 162 L138 175 Z"/>
    <path d="M162 128 L250 85 L218 125 L242 132 L208 152 L228 162 L162 175 Z"/>
    <path d="M150 70 L163 130 L150 222 L137 130 Z"/>
