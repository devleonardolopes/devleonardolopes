  <text x="430" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff" textLength="700" lengthAdjust="spacingAndGlyphs">LEONARDO LOPES</text>
  <rect x="432" y="160" width="140" height="5" fill="#4aa8ff"/>
