<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Leonardo Lopes - Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#050a14"/>
      <stop offset="1" stop-color="#0a1a33"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#1e6fff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- city skyline -->
  <g fill="#0b1426" opacity="0.9">
    <rect x="700" y="210" width="40" height="90"/><rect x="745" y="180" width="55" height="120"/>
    <rect x="805" y="225" width="35" height="75"/><rect x="845" y="150" width="60" height="150"/>
    <rect x="910" y="200" width="45" height="100"/><rect x="960" y="170" width="70" height="130"/>
    <rect x="1035" y="215" width="40" height="85"/><rect x="1080" y="140" width="55" height="160"/>
    <rect x="1140" y="195" width="60" height="105"/>
  </g>
  <!-- blue streaks -->
  <g stroke="#1e90ff" stroke-width="3" opacity="0.55" filter="url(#glow)">
    <line x1="300" y1="60" x2="1200" y2="20"/>
    <line x1="300" y1="240" x2="1200" y2="280"/>
  </g>
  <!-- emblem -->
  <g transform="translate(40,0)" fill="url(#blue)" filter="url(#glow)">
    <path d="M138 128 L50 85 L82 125 L58 132 L92 152 L72 162 L138 175 Z"/>
    <path d="M162 128 L250 85 L218 125 L242 132 L208 152 L228 162 L162 175 Z"/>
    <path d="M150 70 L163 130 L150 222 L137 130 Z"/>
  </g>
  <!-- text -->
  <text x="370" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="6" fill="#ffffff">LEONARDO LOPES</text>
  <rect x="372" y="160" width="120" height="5" fill="#1e90ff"/>
  <text x="372" y="205" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" letter-spacing="4" fill="#5cc8ff">FULL STACK DEVELOPER  ·  PHP  ·  LARAVEL  ·  NODE  ·  BUN</text>
</svg>
